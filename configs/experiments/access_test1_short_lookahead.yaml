extends: ../defaults.yaml

lookahead:
  values_m: [0.50]

initial_condition:
  e_y_m: 0.10
  e_psi_deg: -30.0

gain_sweep:
  rho: [3.0]
  zeta: [1.0]
  representative:
    rho: 3.0
    zeta: 1.0

paths:
  - key: straight
    label: Straight
    type: straight
    params:
      length: 8.0
      num_points: 800
    evaluation:
      length: 6.0
      num_points: 600
  - key: arc
    label: Arc
    type: arc
    params:
      radius: 1.5
      angle_deg: 180.0
      num_points: 1200
    evaluation:
      angle_deg: 90.0
      num_points: 600

experiment:
  max_steps: 1100
  output_dir: results/access_test1_short_lookahead
  export_tex_project_dir: ../tex_docker_environment/projects/fumiya_ieee_access
