[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecpp"
version = "1.0.0"
description = "Error-Compensated Pure Pursuit (ECPP): simulation code of the paper and reproduction of its tests"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.24",
    "pandas>=2.3.3",
    "pillow>=10.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/decwest/ecpp"
"Nav2 plugin" = "https://github.com/decwest/nav2_error_compensated_pure_pursuit_controller"

[project.scripts]
ecpp-paper = "ecpp.paper.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ecpp.paper" = ["*.cpp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Keep a sourced ROS 2 environment from auto-loading its pytest plugins
# (harmless when they are not installed).
addopts = ["-p", "no:launch_testing", "-p", "no:launch_ros"]
